name: Build and publish

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild HiberbeeTheme.sln -restore -p:Configuration=Release -p:DebugType=None -v:m -nologo

      - uses: actions/upload-artifact@v4
        with:
          name: HiberbeeTheme
          path: HiberbeeTheme/bin/HiberbeeTheme.vsix

      - name: Publish to Visual Studio Marketplace
        if: env.VS_MARKETPLACE_TOKEN != ''
        shell: pwsh
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $publisher = Get-ChildItem $vs -Recurse -Filter VsixPublisher.exe | Select-Object -First 1
          & $publisher.FullName publish -payload "HiberbeeTheme/bin/HiberbeeTheme.vsix" -publishManifest publishManifest.json -personalAccessToken $env:VS_MARKETPLACE_TOKEN
